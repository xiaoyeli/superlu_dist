image: liuyangzhuan/superlu_gpu_amd64:v1.2

stages: [build, test]

default:
  tags: [hpsf-gpu, x86_64-nvidiagpu, nvidia-a100]


build:
  stage: build
  script:
    - cd ~/superlu_dist/superlu_dist
    - git pull
    - cd build
    - make install -j
    - cd ../../
    - cp -r superlu_dist $CI_PROJECT_DIR/build_artifact

  artifacts:
    paths:
      - build_artifact
    expire_in: 1 week

# One job per group of .ci_tests_gpu.sh ("./.ci_tests_gpu.sh list" shows the
# tests and their groups).  A test the image cannot run reports SKIP:
#   - the base docker image has no cuda-aware MPI, so the multi-process tests
#     of the C++ GPU code (group 3dcpp) are skipped unless
#     SLU_CI_GPU_AWARE_MPI=1 is set;
#   - the multi-process GPU triangular solves need NVSHMEM.
.gpu_test:
  stage: test
  needs: [build]
  script:
    - cd ~/superlu_dist/superlu_dist/
    - cp -a $CI_PROJECT_DIR/build_artifact/. .
    - ./.ci_tests_gpu.sh "$TEST_GROUP"

test legacy:
  extends: .gpu_test
  variables:
    TEST_GROUP: legacy

test 2d:
  extends: .gpu_test
  variables:
    TEST_GROUP: 2d

test 3d:
  extends: .gpu_test
  variables:
    TEST_GROUP: 3d

test 3dcpp:
  extends: .gpu_test
  variables:
    TEST_GROUP: 3dcpp

test features:
  extends: .gpu_test
  variables:
    TEST_GROUP: features

test batch:
  extends: .gpu_test
  variables:
    TEST_GROUP: batch
