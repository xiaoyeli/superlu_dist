name: GitHub CI tests

on: [push, pull_request]

jobs:
  # The library is built once per configuration and all the tests of
  # .ci_tests.sh run against it (./.ci_tests.sh list shows them).  A test that
  # needs a package the configuration lacks reports SKIP.
  test:
    name: Build and test (${{ matrix.config.name }})
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026, which has no
    # libparmetis-dev package and ships Open MPI 5 instead of 4.1.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        config:
          # 32-bit indices, no ordering package, system BLAS
          - name: basic
            packages: ""
            cflags: -std=c11 -DPRNTlevel=1 -DPROFlevel=1 -DDEBUGlevel=0
            cmake: >-
              -DTPL_ENABLE_PARMETISLIB=OFF
            tests: all
            ctest: false
          # METIS/ParMETIS orderings, parallel symbolic factorization, LAPACK
          # (DiagInv); also runs the ctest suite
          - name: parmetis-lapack
            packages: libmetis-dev libparmetis-dev
            cflags: -std=c11 -DPRNTlevel=1 -DPROFlevel=1 -DDEBUGlevel=0
            cmake: >-
              -DTPL_ENABLE_PARMETISLIB=ON
              -DTPL_PARMETIS_INCLUDE_DIRS=/usr/include
              -DTPL_PARMETIS_LIBRARIES="/usr/lib/libparmetis.so;/usr/lib/x86_64-linux-gnu/libmetis.so"
              -DTPL_ENABLE_LAPACKLIB=ON
            tests: all
            ctest: true
          # 64-bit indices
          - name: int64
            packages: ""
            cflags: -std=c11 -DPRNTlevel=1 -DPROFlevel=1 -DDEBUGlevel=0
            cmake: >-
              -DTPL_ENABLE_PARMETISLIB=OFF
              -DXSDK_INDEX_SIZE=64
            tests: all
            ctest: false
          # The library's debug checks (DEBUGlevel=1), 32-bit indices.  (With
          # 64-bit indices some debug-only checks do not compile with GCC 14.)
          # The driver skips what the debug allocator aborts on: the 3D
          # interface on several Z-layers with ColPerm=NATURAL.
          - name: debug
            packages: ""
            cflags: -std=c11 -DPRNTlevel=1 -DPROFlevel=1 -DDEBUGlevel=1
            cmake: >-
              -DTPL_ENABLE_PARMETISLIB=OFF
            tests: all
            ctest: false

    env:
      OMP_NUM_THREADS: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ gfortran openmpi-bin libopenmpi-dev \
               libblas-dev liblapack-dev ${{ matrix.config.packages }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=mpicc
          -DCMAKE_CXX_COMPILER=mpic++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="${{ matrix.config.cflags }}"
          -DCMAKE_CXX_FLAGS="-DAdd_ -DRELEASE"
          -DTPL_ENABLE_INTERNAL_BLASLIB=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DMPIEXEC_PREFLAGS=--oversubscribe
          ${{ matrix.config.cmake }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test (.ci_tests.sh)
        run: ./.ci_tests.sh "${{ matrix.config.tests }}"

      - name: Test (ctest)
        if: ${{ matrix.config.ctest }}
        run: ctest --test-dir build -L ci --output-on-failure

  # Same sanitizer configuration as superlu's test-ubuntu-asan-ubsan job,
  # adapted for an MPI build: the library is built once and the 15 tests of
  # the group "legacy" of .ci_tests.sh run against it.  (The other groups
  # have not been run under the sanitizers yet; add them here once they are
  # clean, e.g. "./.ci_tests.sh legacy 2d 3d".)
  test-asan-ubsan:
    name: Ubuntu AddressSanitizer and UndefinedBehaviorSanitizer build and test
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026, which has no
    # libparmetis-dev package and ships Open MPI 5 instead of 4.1.
    runs-on: ubuntu-24.04
    # Backstop in case one rank aborts and the others sit in a collective.
    timeout-minutes: 60

    env:
      # detect_leaks=0: Open MPI leaks internally (dlopen'd MCA components etc.),
      #   so LeakSanitizer would fail every run for allocations that are not ours.
      # log_path: one report file per rank instead of interleaved stdout.
      ASAN_OPTIONS: detect_leaks=0:log_path=${{ github.workspace }}/sanitizer-logs/asan
      UBSAN_OPTIONS: print_stacktrace=1:log_path=${{ github.workspace }}/sanitizer-logs/ubsan
      # Two threads per rank so the sanitizers also cover the OpenMP paths
      # (pdgstrs2_omp tasks, threaded solve) and the concurrent calls they make
      # into the internal CBLAS. Kept at 2 because the tests oversubscribe the
      # runner with up to 6 ranks.
      OMP_NUM_THREADS: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ openmpi-bin libopenmpi-dev

      # The internal CBLAS is built on purpose: a system BLAS is not instrumented,
      # so an out-of-bounds read or write that SuperLU hands to a BLAS call would go
      # unreported. With the instrumented CBLAS, the BLAS boundary is covered too.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=mpicc
          -DCMAKE_CXX_COMPILER=mpic++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-std=c11 -DPRNTlevel=1 -DPROFlevel=1 -DDEBUGlevel=1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-DAdd_ -DRELEASE -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DTPL_ENABLE_PARMETISLIB=OFF
          -DTPL_ENABLE_INTERNAL_BLASLIB=ON
          -DXSDK_ENABLE_Fortran=OFF
          -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          mkdir -p sanitizer-logs
          ./.ci_tests.sh legacy

      - name: Show sanitizer reports
        if: failure()
        run: |
          shopt -s nullglob
          for f in sanitizer-logs/*; do
            echo "===== $f ====="
            cat "$f"
          done
